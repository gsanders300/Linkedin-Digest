[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-digest"
version = "1.0.1"
description = "Automated LinkedIn feed monitor with AI summaries and email digest"
requires-python = ">=3.11"
dependencies = [
    "apify-client==3.0.4",
    "google-genai==2.10.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "tzdata==2026.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
