[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-digest"
# Version comes from the latest vX.Y.Z git tag, which release.yml creates on every push to main.
dynamic = ["version"]
description = "Automated LinkedIn feed monitor with AI summaries and email digest"
requires-python = ">=3.11"
dependencies = [
    "apify-client==3.0.4",
    "google-genai==2.10.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "tzdata==2026.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools_scm]
# Used when there is no git metadata, e.g. a "Download ZIP" copy.
fallback_version = "0.0.0"

[tool.uv]
# Rebuild when commits or tags change so the installed version stays current.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
