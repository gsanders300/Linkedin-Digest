name: Tests

# The gate for Dependabot auto-merge: the ruleset on main requires this `test` check.
# Same install and tests as daily-linkedin-check.yml, but --locked, so a uv.lock that
# no longer matches pyproject.toml fails here instead of being installed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv installs the Python version in .python-version.
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install dependencies
        run: uv sync --locked --no-install-project
      - name: Run tests
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -m unittest discover -s tests -v
