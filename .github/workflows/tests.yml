name: Tests

# The gate for Dependabot auto-merge: the ruleset on main requires this `test` check.
# Same install and tests as daily-linkedin-check.yml, but --locked, so a uv.lock that
# no longer matches pyproject.toml fails here instead of being installed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # uv installs the Python version in .python-version.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync --locked --no-install-project
      - name: Run tests
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -m unittest discover -s tests -v
