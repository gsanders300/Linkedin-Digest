name: UV Lock Upgrade
on:
  schedule:
    - cron: "0 8 * * 6"   # 3am ET Saturday (EST). Use "0 7 * * 6" in EDT.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so setuptools-scm sees the version tags
      - uses: astral-sh/setup-uv@v10.2.0
      # pyproject.toml pins direct deps with ==, so only indirect deps move.
      - run: uv lock --upgrade
      # Same install and test steps as daily-linkedin-check.yml.
      - run: uv sync --frozen --no-install-project
      - name: Run tests
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -m unittest discover -s tests -v
      # Same commit-and-push pattern as the seen_posts.json step in daily-linkedin-check.yml.
      - name: Commit upgraded lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock unchanged; nothing to commit."
          else
            git commit -m "chore: uv lock --upgrade"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
