name: UV Lock Upgrade
on:
  schedule:
    - cron: "0 8 * * 6"   # 3am ET Saturday (EST). Use "0 7 * * 6" in EDT.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so setuptools-scm sees the version tags
      - uses: astral-sh/setup-uv@v10.2.0
      # pyproject.toml pins direct deps with ==, so only indirect deps move.
      - run: uv lock --upgrade
      # Same install and test steps as daily-linkedin-check.yml.
      - run: uv sync --frozen --no-install-project
      - name: Run tests
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -m unittest discover -s tests -v
      - id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/uv-lock-upgrade
          commit-message: "chore: uv lock --upgrade"
          title: "chore: uv lock --upgrade"
          add-paths: uv.lock
      - if: steps.cpr.outputs.pull-request-number != ''
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
