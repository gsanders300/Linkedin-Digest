name: LinkedIn Digest

on:
  workflow_dispatch:

# Serialize runs so a manual dispatch during an in-flight run cannot double-send
# the digest or race on the seen_posts.json commit. A second trigger queues.
concurrency:
  group: linkedin-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so the pre-push rebase can't hit shallow-clone issues
      # uv installs the Python version in .python-version.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
      # Install the exact versions in uv.lock, including indirect dependencies, so an
      # upstream release can't change an unattended run. The project itself isn't
      # installed because the code runs from src/, and --no-sync below keeps uv run
      # from installing it.
      - name: Install dependencies
        run: uv sync --frozen --no-install-project
      - name: Run tests
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Run monitor
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: uv run --no-sync python src/main.py
      - name: Persist seen post IDs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_posts.json
          if git diff --cached --quiet; then
            echo "No changes to seen_posts.json; nothing to commit."
          else
            git commit -m "chore: update seen post IDs [skip ci]"
            # Rebase onto anything that landed during the run, then push.
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

